name: Build Sadi Connect APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Cache Debug Keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1

      - name: Restore or Create Debug Keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Show Debug Keystore SHA fingerprints
        run: |
          {
            echo "## Debug keystore fingerprints (add SHA-1 to Firebase)"
            echo '```'
            keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage Named Debug APK
        run: |
          mkdir -p build-apk-output
          cp app/build/outputs/apk/debug/app-debug.apk build-apk-output/Sadi-Connect-debug.apk
          ls -lh build-apk-output/Sadi-Connect-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sadi-connect-debug-apk
          path: build-apk-output/Sadi-Connect-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Build Summary
        run: |
          APK_SIZE=$(du -h build-apk-output/Sadi-Connect-debug.apk | cut -f1)
          {
            echo "## Sadi Connect Debug APK Built Successfully"
            echo "- **Artifact Name:** \`sadi-connect-debug-apk\`"
            echo "- **APK File:** \`Sadi-Connect-debug.apk\` ($APK_SIZE)"
            echo "- **Application ID:** \`com.aistudio.sadiconnect.xkqmvp\`"
            echo ""
            echo "Download the APK zip from the **Artifacts** section at the bottom of this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"
